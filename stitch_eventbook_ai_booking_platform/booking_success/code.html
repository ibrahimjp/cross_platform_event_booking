<style>
        .confetti-piece {
            position: absolute;
            width: 10px;
            height: 20px;
            background: #8455ef;
            opacity: 0;
            animation: fall linear infinite;
        }
        @keyframes fall {
            0% { transform: translateY(-100vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(360deg); opacity: 0; }
        }
        .bg-gradient-text {
            background: linear-gradient(135deg, #8455ef, #6b38d4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex items-center justify-center relative overflow-hidden font-body-md">
<!-- Confetti Background -->
<div class="absolute inset-0 pointer-events-none z-0" id="confetti-container"></div>
<main class="w-full max-w-lg mx-auto px-margin-mobile md:px-0 relative z-10">
<!-- Success Card -->
<div class="bg-surface-container-lowest rounded-[24px] shadow-[0_10px_30px_rgba(139,92,246,0.12)] p-8 md:p-12 text-center border border-outline-variant/20 relative overflow-hidden backdrop-blur-xl">
<!-- Decorative Glow -->
<div class="absolute top-0 left-1/2 -translate-x-1/2 w-48 h-48 bg-primary/10 rounded-full blur-3xl -z-10"></div>
<!-- Icon -->
<div class="mx-auto w-24 h-24 rounded-full bg-gradient-to-tr from-primary to-primary-container flex items-center justify-center shadow-lg shadow-primary/20 mb-8 transform hover:scale-105 transition-transform duration-300">
<span class="material-symbols-outlined text-on-primary" style="font-size: 48px; font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
<!-- Headline -->
<h1 class="font-display-lg-mobile md:font-display-lg text-display-lg-mobile md:text-display-lg bg-gradient-text mb-4">Success!</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant mb-8">Your booking is confirmed.</p>
<!-- Event Summary Box -->
<div class="bg-surface-container-low rounded-xl p-6 text-left mb-8 border border-outline-variant/30 relative">
<h3 class="font-headline-sm text-headline-sm text-on-surface mb-2">Design Leadership Summit 2024</h3>
<div class="space-y-3 mt-4">
<div class="flex items-center text-on-surface-variant">
<span class="material-symbols-outlined mr-3 text-primary-container">calendar_month</span>
<span class="font-body-md text-body-md">October 15, 2024 • 9:00 AM</span>
</div>
<div class="flex items-center text-on-surface-variant">
<span class="material-symbols-outlined mr-3 text-primary-container">location_on</span>
<span class="font-body-md text-body-md">Moscone Center, San Francisco</span>
</div>
<div class="flex items-center text-on-surface-variant">
<span class="material-symbols-outlined mr-3 text-primary-container">confirmation_number</span>
<span class="font-body-md text-body-md">Order #EB-8472-X9</span>
</div>
</div>
<!-- Small image thumbnail -->
<div class="mt-6 rounded-lg overflow-hidden h-32 relative shadow-sm">
<img class="w-full h-full object-cover" data-alt="A bright, modern architectural shot of a convention center exterior during a clear, sunny day. High-key lighting highlighting sleek glass panels and minimalist concrete structures, reflecting a premium corporate event setting in a light-mode aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAoM_x1lxTbZwNnMwxHlIh64vPuV7uSRGs_GDwCY9E9hQMmyVZvyody3oWVHzIC9J3lM5FOK1XBt5CgKZY-QWXUxz_oNzIIHl5JvTiMjKVkqwXU52zLVpFl_GlXv-yKtReGhmkdxxfBDp384EtNYrhi1svXnTBwugSGlnbqMWTK_2yn5sbDDxL6drrHMSCDk60q4qM-oTm2JuQKr4T6vOYvrrCBjoxoqD3zZh1AtOWMsv7O7LHRxEI1"/>
</div>
</div>
<!-- Action Buttons -->
<div class="flex flex-col space-y-4">
<button class="w-full bg-gradient-to-r from-primary to-primary-container text-on-primary font-label-md text-label-md py-4 rounded-xl shadow-[0_4px_20px_rgba(107,56,212,0.2)] hover:opacity-90 hover:shadow-[0_8px_25px_rgba(107,56,212,0.3)] transition-all active:scale-95 flex justify-center items-center">
<span class="material-symbols-outlined mr-2 text-[20px]">local_activity</span>
                    View Ticket
                </button>
<button class="w-full bg-transparent border border-outline-variant text-primary font-label-md text-label-md py-4 rounded-xl hover:bg-primary/5 transition-all active:scale-95">
                    Return to Home
                </button>
</div>

</main>
<script>
        // Simple Confetti Logic
        const colors = ['#8455ef', '#6b38d4', '#d0bcff', '#e9ddff'];
        const container = document.getElementById('confetti-container');

        for (let i = 0; i < 50; i++) {
            const confetti = document.createElement('div');
            confetti.classList.add('confetti-piece');
            
            // Randomize properties
            confetti.style.left = Math.random() * 100 + 'vw';
            confetti.style.animationDelay = Math.random() * 3 + 's';
            confetti.style.animationDuration = Math.random() * 2 + 3 + 's';
            confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            
            // Randomize shape (some squares, some rectangles)
            if (Math.random() > 0.5) {
                confetti.style.height = '10px';
                confetti.style.width = '10px';
                confetti.style.borderRadius = '50%';
            }

            container.appendChild(confetti);
        }
    </script>
