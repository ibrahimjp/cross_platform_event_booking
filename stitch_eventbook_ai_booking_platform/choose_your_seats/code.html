<style>
        /* Custom styles for specific component interactions not easily handled by inline utility classes alone */
        .seat {
            transition: all 0.2s ease-in-out;
            cursor: pointer;
        }
        .seat.occupied {
            cursor: not-allowed;
            opacity: 0.5;
        }
        .seat.available:hover {
            transform: scale(1.1);
        }
        .seat.selected {
            transform: scale(1.1);
        }
    </style>
</head>
<body class="bg-background text-on-background antialiased selection:bg-primary-container selection:text-on-primary-container min-h-screen flex flex-col">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-surface/80 dark:bg-surface-dim/80 backdrop-blur-xl shadow-sm border-b border-outline-variant/30">
<div class="flex items-center justify-between px-margin-mobile md:px-margin-desktop h-16 w-full max-w-container-max-width mx-auto">
<button class="text-on-surface-variant dark:text-on-secondary-fixed-variant hover:opacity-80 transition-opacity active:scale-95 duration-200 p-2 flex items-center justify-center rounded-full">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">menu</span>
</button>
<div class="font-headline-md text-headline-md font-bold bg-gradient-to-r from-primary to-primary-container bg-clip-text text-transparent">
                EventBook
            </div>
<button class="text-on-surface-variant dark:text-on-secondary-fixed-variant hover:opacity-80 transition-opacity active:scale-95 duration-200 p-2 flex items-center justify-center rounded-full">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">smart_toy</span>
</button>
</div>
</header>
<!-- Main Content Canvas -->
<!-- Suppressing BottomNav because this is a transactional/task-focused flow (Checkout/Selection) -->
<main class="flex-grow pt-24 pb-32 px-margin-mobile md:px-margin-desktop max-w-container-max-width mx-auto w-full flex flex-col gap-unit items-center">
<!-- Context Header -->
<div class="w-full text-center mb-6">
<h1 class="font-headline-sm text-headline-sm text-on-surface">Global Tech Symposium</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-1">Main Auditorium • Oct 15, 2024</p>
</div>
<!-- Legend -->
<div class="flex items-center justify-center gap-6 mb-8 w-full max-w-md bg-surface-container-lowest/80 backdrop-blur-md p-4 rounded-xl shadow-[0_4px_20px_rgba(31,41,55,0.05)] border border-outline-variant/20">
<div class="flex items-center gap-2">
<div class="w-4 h-4 rounded bg-surface-container-low border border-outline-variant"></div>
<span class="font-label-sm text-label-sm text-on-surface-variant">Available</span>
</div>
<div class="flex items-center gap-2">
<div class="w-4 h-4 rounded bg-primary shadow-[0_2px_8px_rgba(139,92,246,0.4)]"></div>
<span class="font-label-sm text-label-sm text-on-surface-variant">Selected</span>
</div>
<div class="flex items-center gap-2">
<div class="w-4 h-4 rounded bg-surface-variant border border-outline-variant/50"></div>
<span class="font-label-sm text-label-sm text-on-surface-variant opacity-50">Occupied</span>
</div>
</div>
<!-- Seat Map Container -->
<div class="relative w-full max-w-2xl bg-surface-container-lowest rounded-[24px] shadow-[0_10px_30px_rgba(31,41,55,0.05)] p-8 overflow-hidden flex flex-col items-center">
<!-- Stage Indicator -->
<div class="w-3/4 h-12 border-t-4 border-outline-variant/30 rounded-t-[100%] mb-12 flex items-end justify-center pb-2">
<span class="font-label-md text-label-md text-on-surface-variant uppercase tracking-widest text-opacity-50">Stage</span>
</div>
<!-- Grid rows -->
<div class="flex flex-col gap-4" id="seat-grid">
<!-- Rows will be injected by JS for structure, but writing some HTML for initial render -->
<script>
                    const layout = [
                        ['O', 'A', 'A', 'A', 'O', ' ', 'A', 'A', 'A', 'A', 'A', ' ', 'O', 'A', 'O', 'A', 'A'],
                        ['A', 'A', 'O', 'A', 'A', ' ', 'A', 'O', 'A', 'A', 'O', ' ', 'A', 'A', 'A', 'A', 'A'],
                        ['A', 'A', 'A', 'A', 'A', ' ', 'O', 'O', 'O', 'A', 'A', ' ', 'A', 'A', 'A', 'O', 'A'],
                        ['A', 'O', 'A', 'A', 'A', ' ', 'A', 'A', 'A', 'A', 'A', ' ', 'A', 'A', 'A', 'A', 'O'],
                        ['A', 'A', 'A', 'A', 'A', ' ', 'A', 'A', 'A', 'A', 'A', ' ', 'A', 'O', 'A', 'A', 'A'],
                        ['O', 'O', 'A', 'A', 'A', ' ', 'A', 'A', 'A', 'O', 'O', ' ', 'A', 'A', 'A', 'A', 'A']
                    ];
                    
                    document.write(layout.map((row, rowIndex) => `
                        <div class="flex items-center gap-2 justify-center">
                            <span class="w-6 text-right font-label-sm text-label-sm text-on-surface-variant opacity-50 mr-2">${String.fromCharCode(65 + rowIndex)}</span>
                            ${row.map(seat => {
                                if (seat === ' ') return `<div class="w-6 h-6 sm:w-8 sm:h-8"></div>`; // Aisle
                                
                                const baseClasses = "seat w-6 h-6 sm:w-8 sm:h-8 rounded-lg flex items-center justify-center font-label-sm text-label-sm select-none";
                                if (seat === 'O') {
                                    return `<div class="${baseClasses} occupied bg-surface-variant border border-outline-variant/50 text-on-surface-variant/50"></div>`;
                                } else {
                                    return `<div class="${baseClasses} available bg-surface-container-low border border-outline-variant text-transparent hover:border-primary hover:text-primary" onclick="toggleSeat(this)"></div>`;
                                }
                            }).join('')}
                            <span class="w-6 text-left font-label-sm text-label-sm text-on-surface-variant opacity-50 ml-2">${String.fromCharCode(65 + rowIndex)}</span>
                        </div>
                    `).join(''));
                </script>
</div>
</div>
</main>
<!-- Sticky Bottom Action Bar -->
<div class="fixed bottom-0 left-0 w-full bg-surface/90 backdrop-blur-xl border-t border-outline-variant/30 shadow-[0_-10px_30px_rgba(31,41,55,0.05)] z-40 pb-safe">
<div class="max-w-container-max-width mx-auto px-margin-mobile md:px-margin-desktop py-4 flex items-center justify-between">
<div class="flex flex-col">
<span class="font-body-sm text-body-sm text-on-surface-variant">Selected Seats</span>
<span class="font-headline-sm text-headline-sm text-on-surface font-bold" id="selected-count">0</span>
</div>
<div class="flex items-center gap-6">
<div class="flex flex-col text-right hidden sm:flex">
<span class="font-body-sm text-body-sm text-on-surface-variant">Total</span>
<span class="font-headline-sm text-headline-sm text-primary font-bold" id="total-price">$0.00</span>
</div>
<button class="bg-surface-variant text-on-surface-variant font-label-md text-label-md px-8 py-3 rounded-xl transition-all duration-200 cursor-not-allowed opacity-70 flex items-center gap-2" id="confirm-btn">
                    Confirm Seats
                    <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</div>
</div>
</div>
<script>
        let selectedCount = 0;
        const pricePerSeat = 125.00;

        function toggleSeat(element) {
            if (element.classList.contains('occupied')) return;
            
            element.classList.toggle('selected');
            
            if (element.classList.contains('selected')) {
                // Style as selected
                element.classList.remove('bg-surface-container-low', 'border-outline-variant', 'text-transparent');
                element.classList.add('bg-primary', 'text-on-primary', 'shadow-[0_4px_12px_rgba(139,92,246,0.3)]', 'border-transparent');
                selectedCount++;
            } else {
                // Revert to available
                element.classList.add('bg-surface-container-low', 'border-outline-variant', 'text-transparent');
                element.classList.remove('bg-primary', 'text-on-primary', 'shadow-[0_4px_12px_rgba(139,92,246,0.3)]', 'border-transparent');
                selectedCount--;
            }
            
            updateFooter();
        }

        function updateFooter() {
            document.getElementById('selected-count').innerText = selectedCount;
            document.getElementById('total-price').innerText = `$${(selectedCount * pricePerSeat).toFixed(2)}`;
            
            const confirmBtn = document.getElementById('confirm-btn');
            if (selectedCount > 0) {
                confirmBtn.classList.remove('bg-surface-variant', 'text-on-surface-variant', 'cursor-not-allowed', 'opacity-70');
                confirmBtn.classList.add('bg-gradient-to-r', 'from-primary', 'to-primary-container', 'text-on-primary', 'cursor-pointer', 'opacity-100', 'shadow-[0_4px_16px_rgba(139,92,246,0.2)]', 'hover:opacity-90', 'active:scale-95');
            } else {
                confirmBtn.classList.add('bg-surface-variant', 'text-on-surface-variant', 'cursor-not-allowed', 'opacity-70');
                confirmBtn.classList.remove('bg-gradient-to-r', 'from-primary', 'to-primary-container', 'text-on-primary', 'cursor-pointer', 'opacity-100', 'shadow-[0_4px_16px_rgba(139,92,246,0.2)]', 'hover:opacity-90', 'active:scale-95');
            }
        }
    </script>
</body></html>
