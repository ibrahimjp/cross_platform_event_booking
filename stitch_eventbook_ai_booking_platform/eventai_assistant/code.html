<!DOCTYPE html>

<html class="h-full" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>EventBook - AI Chatbot</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-primary-container": "#fffbff",
                        "primary-fixed-dim": "#d0bcff",
                        "surface-container": "#e6eeff",
                        "surface-variant": "#d9e3f6",
                        "on-secondary": "#ffffff",
                        "secondary": "#5c5f60",
                        "on-surface-variant": "#494454",
                        "on-primary-fixed": "#23005c",
                        "secondary-fixed-dim": "#c5c7c8",
                        "surface-container-high": "#dee9fc",
                        "primary-fixed": "#e9ddff",
                        "outline-variant": "#cbc3d7",
                        "surface-container-low": "#eff4ff",
                        "on-background": "#121c2a",
                        "on-tertiary-container": "#fffbff",
                        "on-secondary-container": "#626566",
                        "inverse-primary": "#d0bcff",
                        "on-tertiary-fixed": "#2c1700",
                        "surface-container-highest": "#d9e3f6",
                        "primary": "#6b38d4",
                        "tertiary-container": "#a76500",
                        "background": "#f8f9ff",
                        "error-container": "#ffdad6",
                        "surface": "#f8f9ff",
                        "surface-tint": "#6d3bd7",
                        "secondary-container": "#e1e3e4",
                        "on-tertiary": "#ffffff",
                        "tertiary-fixed-dim": "#ffb869",
                        "on-primary": "#ffffff",
                        "tertiary-fixed": "#ffdcbb",
                        "on-surface": "#121c2a",
                        "on-error-container": "#93000a",
                        "outline": "#7b7486",
                        "on-secondary-fixed": "#191c1d",
                        "on-primary-fixed-variant": "#5516be",
                        "surface-bright": "#f8f9ff",
                        "error": "#ba1a1a",
                        "on-secondary-fixed-variant": "#454748",
                        "primary-container": "#8455ef",
                        "secondary-fixed": "#e1e3e4",
                        "surface-container-lowest": "#ffffff",
                        "tertiary": "#855000",
                        "inverse-surface": "#27313f",
                        "on-tertiary-fixed-variant": "#673d00",
                        "inverse-on-surface": "#eaf1ff",
                        "on-error": "#ffffff",
                        "surface-dim": "#d0dbed"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "gutter": "24px",
                        "container-max-width": "1280px",
                        "section-gap": "80px",
                        "margin-desktop": "64px",
                        "margin-mobile": "20px",
                        "unit": "8px"
                    },
                    "fontFamily": {
                        "body-md": ["Inter"],
                        "body-lg": ["Inter"],
                        "headline-sm": ["Inter"],
                        "display-lg": ["Inter"],
                        "label-md": ["Inter"],
                        "label-sm": ["Inter"],
                        "headline-md": ["Inter"],
                        "body-sm": ["Inter"],
                        "display-lg-mobile": ["Inter"]
                    },
                    "fontSize": {
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "headline-sm": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "display-lg": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "label-md": ["14px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "label-sm": ["12px", { "lineHeight": "14px", "fontWeight": "500" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "display-lg-mobile": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "700" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.fill {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        .chat-gradient {
            background: linear-gradient(135deg, #8B5CF6 0%, #6D28D9 100%);
        }
        
        .glass-panel {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
    </style>
</head>
<body class="bg-surface text-on-surface font-body-md h-full flex flex-col antialiased selection:bg-primary-container selection:text-on-primary-container">
<!-- TopAppBar -->
<header class="bg-surface/80 dark:bg-surface-dim/80 backdrop-blur-xl border-b border-outline-variant/30 shadow-sm fixed top-0 w-full z-50 flex items-center justify-between px-margin-mobile md:px-margin-desktop h-16 max-w-container-max-width mx-auto left-0 right-0">
<button aria-label="Menu" class="p-2 text-on-surface-variant hover:opacity-80 transition-opacity active:scale-95 duration-200">
<span class="material-symbols-outlined" data-icon="menu">menu</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold bg-gradient-to-r from-primary to-primary-container bg-clip-text text-transparent">
            EventBook
        </h1>
<button aria-label="AI Assistant" class="p-2 text-on-surface-variant hover:opacity-80 transition-opacity active:scale-95 duration-200">
<span class="material-symbols-outlined text-primary" data-icon="smart_toy" data-weight="fill">smart_toy</span>
</button>
</header>
<!-- Chat Main Content Canvas -->
<main class="flex-grow flex flex-col pt-16 pb-20 md:pb-0 h-full max-w-container-max-width mx-auto w-full relative">
<!-- Decorative Ambient Background -->
<div class="absolute inset-0 pointer-events-none overflow-hidden z-0">
<div class="absolute top-1/4 left-1/4 w-[500px] h-[500px] bg-primary/5 rounded-full blur-[100px] mix-blend-multiply"></div>
<div class="absolute bottom-1/4 right-1/4 w-[400px] h-[400px] bg-primary-container/10 rounded-full blur-[80px] mix-blend-multiply"></div>
</div>
<!-- Chat History Area -->
<div class="flex-grow overflow-y-auto px-margin-mobile md:px-margin-desktop py-8 z-10 flex flex-col gap-6" id="chat-container">
<!-- AI Greeting Message -->
<div class="flex items-start gap-4 max-w-[85%] md:max-w-[70%]">
<div class="w-10 h-10 rounded-full bg-surface-container flex items-center justify-center shrink-0 border border-primary/10 shadow-sm">
<span class="material-symbols-outlined text-primary text-xl" data-icon="smart_toy">smart_toy</span>
</div>
<div class="bg-white border border-outline-variant/20 rounded-2xl rounded-tl-sm p-4 shadow-[0_4px_20px_rgba(31,41,55,0.05)]">
<p class="font-body-md text-on-surface mb-2">Hello! I'm EventAI, your personal concierge.</p>
<p class="font-body-sm text-on-surface-variant">I can help you discover perfect events, secure VIP bookings, or plan an entire itinerary based on your preferences. How can I elevate your experience today?</p>
</div>
</div>
<!-- Suggested Questions (Bento-style layout) -->
<div class="ml-14 max-w-[85%] md:max-w-[70%] grid grid-cols-1 md:grid-cols-2 gap-3 mt-2">
<button class="text-left bg-surface-container-low hover:bg-surface-container border border-outline-variant/30 rounded-xl p-3 transition-colors duration-200 group">
<div class="flex items-center gap-2 mb-1">
<span class="material-symbols-outlined text-primary text-sm" data-icon="music_note">music_note</span>
<span class="font-label-md text-on-surface">Find Music</span>
</div>
<p class="font-body-sm text-on-surface-variant group-hover:text-primary transition-colors">Any exclusive jazz nights happening this weekend?</p>
</button>
<button class="text-left bg-surface-container-low hover:bg-surface-container border border-outline-variant/30 rounded-xl p-3 transition-colors duration-200 group">
<div class="flex items-center gap-2 mb-1">
<span class="material-symbols-outlined text-primary text-sm" data-icon="restaurant">restaurant</span>
<span class="font-label-md text-on-surface">Dining Events</span>
</div>
<p class="font-body-sm text-on-surface-variant group-hover:text-primary transition-colors">Book a culinary tasting menu for two.</p>
</button>
<button class="text-left bg-surface-container-low hover:bg-surface-container border border-outline-variant/30 rounded-xl p-3 transition-colors duration-200 group">
<div class="flex items-center gap-2 mb-1">
<span class="material-symbols-outlined text-primary text-sm" data-icon="calendar_month">calendar_month</span>
<span class="font-label-md text-on-surface">Weekend Plan</span>
</div>
<p class="font-body-sm text-on-surface-variant group-hover:text-primary transition-colors">Create a curated itinerary for Friday night.</p>
</button>
</div>
</div>
<!-- Chat Input Area (Sticky Bottom) -->
<div class="p-margin-mobile md:p-margin-desktop pt-4 pb-8 z-20">
<div class="glass-panel rounded-2xl p-2 flex items-center gap-2 shadow-[0_10px_30px_rgba(139,92,246,0.12)]">
<button aria-label="Add attachment" class="p-2 text-on-surface-variant hover:text-primary transition-colors rounded-full hover:bg-primary/5">
<span class="material-symbols-outlined" data-icon="add_circle">add_circle</span>
</button>
<input class="flex-grow bg-transparent border-none focus:ring-0 font-body-md text-on-surface placeholder-on-surface-variant/50 px-2 h-12 outline-none" placeholder="Ask EventAI to find or book..." type="text"/>
<button aria-label="Send message" class="h-10 w-10 rounded-xl chat-gradient flex items-center justify-center text-white shadow-sm hover:opacity-90 transition-opacity active:scale-95 shrink-0">
<span class="material-symbols-outlined" data-icon="send">send</span>
</button>
</div>
<p class="text-center font-label-sm text-on-surface-variant/60 mt-3 hidden md:block">EventAI can make mistakes. Verify important details before booking.</p>
</div>
</main>
<!-- BottomNavBar (Mobile Only - Hidden since this is a specific tool/canvas, but keeping for structural consistency if needed, though instructions say suppress on linear/task-focused. Suppressing as per rules.) -->
<!-- Removed Bottom Nav to prioritize the Chat Canvas -->
</body></html>
